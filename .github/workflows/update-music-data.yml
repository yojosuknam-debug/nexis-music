name: Update Music Data

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 오전 10시 KST (01:00 UTC)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write
  actions: write   # 데이터가 바뀌면 배포 워크플로를 부른다

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch YouTube playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/data.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update music data $(date -u +%Y-%m-%d)"
            git push
            # 기본 토큰의 push 는 deploy.yml 의 push 트리거를 깨우지 못한다
            gh workflow run deploy.yml --ref master
          fi
