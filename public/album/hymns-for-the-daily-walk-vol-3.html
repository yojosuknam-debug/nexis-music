<script>window.ALBUM = {"title": "Hymns for the Daily Walk, Vol. 3", "cover": "/album/covers/cover-df9766de24fd.jpg", "video": "https://www.youtube.com/watch?v=bCae767yzx0", "tracks": [{"n": 1, "title": "Our Refuge When the Mountains Shake", "ms": 96976, "url": "https://audio.yojosuknam.com/audio/hymns-for-the-daily-walk-vol-3/01.mp3", "lyrics": [{"tag": "Intro", "lines": []}, {"tag": "short two-bar introduction", "lines": []}, {"tag": "0:00-0:06", "lines": []}, {"tag": "Verse 1", "lines": []}, {"tag": "full choir in unison, organ and piano", "lines": []}, {"tag": "0:06-0:31", "lines": ["Our God, our shelter and our strength,", "Is near when troubles press us round;", "Though mountains tremble in the sea,", "In Him our steady hope is found."]}, {"tag": "Verse 2", "lines": []}, {"tag": "SATB harmony, softer", "lines": []}, {"tag": "0:31-0:55", "lines": ["When nations rage and kingdoms fall,", "Our anxious hearts are quick to run;", "We hear the noise and fear the storm,", "And soon forget what God has done."]}, {"tag": "Interlude", "lines": []}, {"tag": "organ plays the last two lines", "lines": []}, {"tag": "0:55-1:02", "lines": []}, {"tag": "Verse 3", "lines": []}, {"tag": "SATB harmony, calm and steady", "lines": []}, {"tag": "1:02-1:26", "lines": ["A quiet river makes us glad,", "It runs where God Himself abides;", "So let us rest and wait on Him,", "And shelter those the storm has tried."]}, {"tag": "Verse 4", "lines": []}, {"tag": "full choir and organ, same melody", "lines": []}, {"tag": "1:26-1:51", "lines": ["He breaks the spear and ends the war,", "And calls the restless earth to peace;", "Exalted high in all the lands,", "His praise from us will never cease."]}, {"tag": "Outro", "lines": []}, {"tag": "final cadence, held chord", "lines": []}, {"tag": "1:51-1:58", "lines": []}, {"tag": "End", "lines": []}], "instrumental": false, "youtube": "https://www.youtube.com/watch?v=bCae767yzx0&t=0s"}, {"n": 2, "title": "The Bread That Came from Heaven", "ms": 114321, "url": "https://audio.yojosuknam.com/audio/hymns-for-the-daily-walk-vol-3/02.mp3", "lyrics": [{"tag": "Intro", "lines": []}, {"tag": "short two-bar introduction", "lines": []}, {"tag": "0:00-0:06", "lines": []}, {"tag": "Verse 1", "lines": []}, {"tag": "congregation in unison, piano", "lines": []}, {"tag": "0:06-0:31", "lines": ["Christ, the bread that came from heaven,", "Freely He delights to give;", "All who come are fed and welcomed,", "Given life that they may live."]}, {"tag": "Verse 2", "lines": []}, {"tag": "SATB harmony, humble", "lines": []}, {"tag": "0:31-0:56", "lines": ["We have filled our hands with harvest,", "Still our souls are hungry, Lord;", "Like the crowds who followed after", "Bread, but would not hear Your word."]}, {"tag": "Interlude", "lines": []}, {"tag": "piano plays the last two lines", "lines": []}, {"tag": "0:56-1:02", "lines": []}, {"tag": "Verse 3", "lines": []}, {"tag": "SATB harmony, warm", "lines": []}, {"tag": "1:02-1:27", "lines": ["Feed us, Lord, with living manna,", "Day by day by mercy fed;", "Make us glad to share with others", "All the gifts of broken bread."]}, {"tag": "Verse 4", "lines": []}, {"tag": "full choir and soft organ, same melody", "lines": []}, {"tag": "1:27-1:52", "lines": ["When the final day is dawning,", "You will raise us from the dust;", "Christ, the Bread of life forever,", "You alone deserve our trust."]}, {"tag": "Outro", "lines": []}, {"tag": "final cadence, held chord", "lines": []}, {"tag": "1:52-2:00", "lines": []}, {"tag": "End", "lines": []}], "instrumental": false, "youtube": "https://www.youtube.com/watch?v=bCae767yzx0&t=97s"}, {"n": 3, "title": "Through River and Through Flame", "ms": 104993, "url": "https://audio.yojosuknam.com/audio/hymns-for-the-daily-walk-vol-3/03.mp3", "lyrics": [{"tag": "Intro", "lines": []}, {"tag": "short two-bar introduction", "lines": []}, {"tag": "0:00-0:06", "lines": []}, {"tag": "Verse 1", "lines": []}, {"tag": "full choir in unison, piano and organ", "lines": []}, {"tag": "0:06-0:31", "lines": ["The Lord who made us, Jacob's God,", "Who shaped us with His hand,", "Has bought us back and called us His;", "In Him secure we stand."]}, {"tag": "Verse 2", "lines": []}, {"tag": "SATB harmony, quiet", "lines": []}, {"tag": "0:31-0:56", "lines": ["We fear the river rising high,", "We dread the burning way;", "We count the dangers, not His love,", "And tremble and delay."]}, {"tag": "Interlude", "lines": []}, {"tag": "organ plays the last two lines", "lines": []}, {"tag": "0:56-1:02", "lines": []}, {"tag": "Verse 3", "lines": []}, {"tag": "SATB harmony, steady and warm", "lines": []}, {"tag": "1:02-1:27", "lines": ["Yet through the waters He is near,", "The flood will not prevail;", "So let us walk with those who fear", "And hold them when they fail."]}, {"tag": "Verse 4", "lines": []}, {"tag": "full choir and organ, same melody", "lines": []}, {"tag": "1:27-1:52", "lines": ["The flame will find no hold on us,", "Its heat will pass us by;", "Our Savior, Holy One, our God,", "We praise You, Lord Most High."]}, {"tag": "Outro", "lines": []}, {"tag": "final cadence, held chord", "lines": []}, {"tag": "1:52-2:00", "lines": []}, {"tag": "End", "lines": []}], "instrumental": false, "youtube": "https://www.youtube.com/watch?v=bCae767yzx0&t=212s"}, {"n": 4, "title": "Wait for Light, My Troubled Soul", "ms": 128428, "url": "https://audio.yojosuknam.com/audio/hymns-for-the-daily-walk-vol-3/04.mp3", "lyrics": [{"tag": "Intro", "lines": []}, {"tag": "short two-bar introduction, piano and cello", "lines": []}, {"tag": "0:00-0:07", "lines": []}, {"tag": "Verse 1", "lines": []}, {"tag": "small choir in unison, soft piano, gentle three-beat lilt", "lines": []}, {"tag": "0:07-0:33", "lines": ["Living God, my soul is dry,", "Like a field that waits for rain;", "Day and night I wake and weep,", "When will I see You again?"]}, {"tag": "Verse 2", "lines": []}, {"tag": "SATB harmony, quiet and aching", "lines": []}, {"tag": "0:33-0:59", "lines": ["I remember singing loud,", "Walking with the joyful crowd;", "Now my heart has sunk so low,", "Waves of sorrow overflow."]}, {"tag": "Interlude", "lines": []}, {"tag": "cello plays the last line", "lines": []}, {"tag": "0:59-1:06", "lines": []}, {"tag": "Verse 3", "lines": []}, {"tag": "SATB harmony, a little warmer", "lines": []}, {"tag": "1:06-1:32", "lines": ["Though the roaring waters sweep,", "Still Your love will come by day;", "In the night Your song I keep,", "For the weary, Lord, I pray."]}, {"tag": "Verse 4", "lines": []}, {"tag": "full choir and soft organ, hopeful, same melody", "lines": []}, {"tag": "1:32-1:58", "lines": ["Why so troubled, O my soul?", "Hope in God and wait for light;", "I will praise Him, who makes whole,", "Morning breaks beyond the night."]}, {"tag": "Outro", "lines": []}, {"tag": "final cadence, held major chord", "lines": []}, {"tag": "1:58-2:06", "lines": []}, {"tag": "End", "lines": []}], "instrumental": false, "youtube": "https://www.youtube.com/watch?v=bCae767yzx0&t=318s"}, {"n": 5, "title": "He Goes with Us Each Day", "ms": 93806, "url": "https://audio.yojosuknam.com/audio/hymns-for-the-daily-walk-vol-3/05.mp3", "lyrics": [{"tag": "Intro", "lines": []}, {"tag": "short two-bar introduction", "lines": []}, {"tag": "0:00-0:05", "lines": []}, {"tag": "Verse 1", "lines": []}, {"tag": "full choir in unison, organ, bright", "lines": []}, {"tag": "0:05-0:25", "lines": ["The risen Lord now reigns,", "All earth and sky are His;", "On hillside green He meets His own", "And tells them who He is."]}, {"tag": "Verse 2", "lines": []}, {"tag": "SATB harmony, humble", "lines": []}, {"tag": "0:25-0:45", "lines": ["We worship, yet we doubt,", "Our faith is weak and small;", "Yet still He calls the ones who fear", "And sends us, one and all."]}, {"tag": "Interlude", "lines": []}, {"tag": "organ plays the last line", "lines": []}, {"tag": "0:45-0:50", "lines": []}, {"tag": "Verse 3", "lines": []}, {"tag": "SATB harmony, steady", "lines": []}, {"tag": "
